[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aircheck"
version = "0.0.0"
description = "Deterministic contracts for the AIRCheck autonomous media-delivery agent."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<0.129",
  "uvicorn>=0.30,<0.49",
  "httpx>=0.27,<0.29",
]
test = [
  "pytest>=8.4,<9",
  "fastapi>=0.115,<0.129",
  "uvicorn>=0.30,<0.49",
  "httpx>=0.27,<0.29",
  # boto3 supplies botocore.exceptions used by the S3 durable-store / mutation-lease
  # tests (S3 conditional-write preconditions). Kept in the test extra so the full
  # suite runs on a fresh clone without a separate AWS install.
  "boto3>=1.40,<2",
]
# Deployment/control-plane orchestration (deploy/deploy.py) and the S3 durable store
# at runtime. Requires boto3>=1.40 for S3 conditional writes (If-Match/If-None-Match).
deploy = [
  "boto3>=1.40,<2",
]
agent = [
  "strands-agents[gemini]==1.54.0",
  "google-genai==2.22.0",
  "google-auth==2.57.1",
]

[tool.hatch.build.targets.wheel]
packages = ["aircheck"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # Third-party only (M7 environment drift): anyio >= 4.15 deprecated the
  # `anyio.abc.BlockingPortal` alias that Starlette's TestClient still imports.
  # This silences ONLY that specific upstream deprecation so the FastAPI test
  # client keeps working; AIRCheck's own code remains warning-clean and every
  # test still runs and asserts. See docs/evidence/M7/ and DECISIONS D-021.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
